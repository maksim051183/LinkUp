<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LinkUp</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F0F28">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:rgba(0,0,0,.45);--card:rgba(14,14,32,.7);--tx:#eceefa;--mut:#a3a8cc;--pri:#7c3aed;--pri2:#22d3ee;--pink:#f472b6;--bd:rgba(160,170,255,.2);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
.bgv{position:fixed;inset:0;z-index:-1;background:#000;overflow:hidden;animation:hue 40s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.bgv i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(95px);opacity:.5;animation:fl 22s ease-in-out infinite alternate}
.bgv i:nth-child(1){background:#7c3aed;left:-25vmax;top:-20vmax}
.bgv i:nth-child(2){background:#1e1b8a;right:-30vmax;top:5vmax;animation-delay:-6s;animation-duration:26s}
.bgv i:nth-child(3){background:#2563eb;left:-10vmax;bottom:-35vmax;animation-delay:-11s;animation-duration:28s}
.bgv i:nth-child(4){background:#22d3ee;right:-30vmax;bottom:-30vmax;opacity:.36;animation-delay:-16s;animation-duration:32s}
@keyframes fl{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(18vmax,10vmax) scale(1.2) rotate(40deg)}100%{transform:translate(-8vmax,22vmax) scale(.9) rotate(-30deg)}}
.w{max-width:640px;margin:0 auto;padding:env(safe-area-inset-top,0px) 14px 24px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0 8px;backdrop-filter:blur(10px)}
header{font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.logo{font-family:Unbounded,Manrope,sans-serif;background:linear-gradient(90deg,var(--pri),var(--pri2),var(--pink),var(--pri));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35)}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:rgba(0,0,0,.4);color:var(--tx);font:inherit;margin-bottom:8px}
button{--sh:#4c1d95;background:linear-gradient(180deg,#9b6bff,var(--pri));color:#fff;border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--sh),0 10px 16px rgba(0,0,0,.4);transform:translateY(0);transition:transform .1s,box-shadow .1s}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh),0 3px 6px rgba(0,0,0,.4)}
button:disabled{opacity:.6;cursor:default}
.sec{--sh:#05050f;background:linear-gradient(180deg,#232345,#14142b);color:var(--mut);border:1px solid var(--bd)}.sec.liked{color:var(--pink);border-color:var(--pink)}
.chips{display:flex;gap:8px;margin-bottom:12px}.chips button{flex:1;--sh:#05050f;background:#14142b;color:var(--mut);border:1px solid var(--bd)}.chips button.on{--sh:#4c1d95;background:linear-gradient(180deg,#9b6bff,var(--pri));color:#fff}
.dng{--sh:#7f1d1d;background:linear-gradient(180deg,#f87171,#dc2626)}.ok{--sh:#166534;background:linear-gradient(180deg,#4ade80,#16a34a)}
.auth{max-width:380px;margin:6vh auto 0;text-align:center}.auth h1{font-size:26px;margin:0 0 4px}
.row{display:flex;gap:10px;align-items:center}.it{cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:13px}.av.xl{width:96px;height:96px;font-size:36px;margin:0 auto 10px}.av.md{width:56px;height:56px;border:2px solid #000}
.mut{color:var(--mut);font-size:13px}.hs{color:var(--pri2);font-weight:800}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--bd);padding:2px 8px;border-radius:99px;color:var(--mut)}
nav{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;display:flex;padding:4px;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.4)}
nav button{--sh:transparent;background:none;box-shadow:none;color:var(--mut);flex:1;font-size:11px;padding:6px 2px;border-radius:12px}nav button.on{color:#fff;background:linear-gradient(180deg,#9b6bff,#6d28d9);box-shadow:0 3px 0 #4c1d95}nav span{display:block;font-size:20px}
.msgs{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);word-wrap:break-word}.m.me{align-self:flex-end;background:var(--pri);border-color:var(--pri)}
.m b{font-size:11px;display:block;opacity:.8}
.lk{--sh:transparent;background:none;box-shadow:none;border:0;padding:2px 6px;font-size:12px;font-weight:800;color:var(--mut);border-radius:8px}.lk.liked{color:var(--pink)}
.m.me .lk{color:#fff;opacity:.8}.m.me .lk.liked{opacity:1}
.cms{border-top:1px solid var(--bd);margin-top:10px;padding-top:10px}.cm{display:flex;gap:8px;margin-bottom:10px}
.cb{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;flex:1;min-width:0;word-wrap:break-word}.cb b{font-size:13px}.cb p{margin:0}
.pimg{width:100%;max-height:480px;object-fit:cover;border-radius:14px;margin:8px 0;display:block;background:#000}
a{color:var(--pri2)}
/* TikTok-style side actions */
.pw{display:flex;gap:10px;align-items:flex-start}.side{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:6px}.pc{flex:1;min-width:0}.pc p{margin:4px 0}
.ab{--sh:#05050f;position:relative;width:52px;padding:8px 4px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;background:linear-gradient(180deg,#2a2a52,#15152e);border:1px solid var(--bd);color:var(--tx)}
.ab .ic{font-size:22px;display:block}.ab.liked{color:var(--pink);border-color:var(--pink)}
.ab.boom{animation:rb 1s linear}.ab.boom .ic{animation:pop .7s}
.ab.boom:after{content:'';position:absolute;inset:0;border-radius:18px;border:3px solid var(--pink);animation:ring .7s ease-out forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.9) rotate(-18deg)}60%{transform:scale(.85) rotate(8deg)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(2.2);opacity:0}}
@keyframes rb{0%{background:#f43f5e}20%{background:#f59e0b}40%{background:#22c55e}60%{background:#22d3ee}80%{background:#a855f7}100%{background:#15152e}}
/* stories */
.stb{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}.st{flex:none;width:66px;text-align:center;cursor:pointer;font-size:11px}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--pri),var(--pri2),var(--pink),var(--pri));display:inline-block;animation:sp 4s linear infinite}.ring.my{background:var(--bd);animation:none}
@keyframes sp{to{filter:hue-rotate(360deg)}}
.st .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}
.sv{position:relative;width:min(420px,100%);height:min(88vh,760px);background:#000;border-radius:22px;overflow:hidden}
.sv img,.sv video{width:100%;height:100%;object-fit:contain;display:block}
.bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}.bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;position:relative}
.bars i.d:after,.bars i.a:after{content:'';position:absolute;inset:0;background:#fff;transform-origin:left}.bars i.a:after{animation:fill 5s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.svh{position:absolute;top:18px;left:10px;right:10px;z-index:4;display:flex;align-items:center;gap:8px;text-shadow:0 1px 4px #000}
.cap{position:absolute;bottom:0;left:0;right:0;padding:50px 16px 22px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:18px;font-weight:800;text-align:center;z-index:2}
.tp{position:absolute;top:70px;bottom:90px;width:40%;z-index:3}.tp.l{left:0}.tp.r{right:0}
.rb{width:100%;margin-bottom:10px;text-align:left}

.aw{position:relative;display:inline-block;flex:none;line-height:0}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#64748b;border:2px solid #0e0e20}.dot.on{background:#22c55e}
.reels{height:calc(100dvh - 112px);min-height:500px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden;border-radius:18px}
.reel video,.reel img{width:100%;height:100%;object-fit:cover;display:block}
.tx{height:100%;display:grid;place-items:center;padding:30px 70px 90px 24px;text-align:center;font:800 24px Unbounded,Manrope,sans-serif;background:linear-gradient(135deg,#4c1d95,#0e7490);word-break:break-word}
.rs{position:absolute;right:8px;bottom:90px;z-index:3}.rs .ab{background:rgba(0,0,0,.45)}
.ri{position:absolute;left:0;right:70px;bottom:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:2}.ri p{margin:6px 0 0}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.gi{aspect-ratio:9/16;background:#14142b;border-radius:8px;overflow:hidden;font-size:11px;display:grid;cursor:pointer;word-break:break-word}.gi img,.gi video{width:100%;height:100%;object-fit:cover}
.fab{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 304px));padding:14px 22px;border-radius:99px;font-size:16px;background:linear-gradient(135deg,var(--pri),var(--pink));--sh:#4c1d95}
.stb{padding:2px 2px 8px!important;margin-bottom:0!important}.st{width:56px!important}.st .av.md{width:46px;height:46px}
.top{padding:6px 0!important}header{margin-bottom:4px!important}nav button{padding:4px 2px!important}nav span{font-size:17px!important}
.live-center{display:flex;justify-content:center;margin:8px 0 12px}.live-center button{min-width:190px;padding:10px 22px;border-radius:999px;background:linear-gradient(135deg,#ef4444,#be123c,#7c3aed);--sh:#7f1d1d;box-shadow:0 4px 0 var(--sh),0 8px 18px rgba(239,68,68,.25);font-size:14px}.live-center .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:8px;box-shadow:0 0 10px #fff}
.vb{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;margin-left:4px;vertical-align:middle;font-family:Manrope}select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#14142b;color:var(--tx);font:inherit}
[data-go]{cursor:pointer}
#spl{position:fixed;inset:0;z-index:999;display:grid;place-content:center;justify-items:center;text-align:center;background:#fff;animation:splo .6s ease 3.6s forwards;overflow:hidden}
#spl i{position:absolute;border-radius:50%;opacity:.18;animation:fl 4s ease-in-out infinite alternate}
#spl i:nth-child(1){width:240px;height:240px;background:#0f9d2e;left:8%;top:14%}#spl i:nth-child(2){width:200px;height:200px;background:#ffc800;right:10%;bottom:14%;animation-delay:-1.5s}#spl i:nth-child(3){width:120px;height:120px;background:#111;left:60%;top:10%;opacity:.07;animation-delay:-3s}
.lgw{position:relative;display:flex;align-items:flex-end;font-size:clamp(60px,17vw,150px)}
.lgw img{height:1em;width:auto;mix-blend-mode:multiply;opacity:0;animation:drop .7s cubic-bezier(.3,1.6,.5,1) var(--d) forwards}
.ul{position:relative;display:block;height:5px;width:0;border-radius:3px;background:linear-gradient(90deg,#0f9d2e,#ffc800);margin-top:16px;animation:gr 1s ease 1.2s forwards}
#spl p{position:relative;margin-top:22px;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:#111;opacity:0;animation:fi 1s ease 1.6s forwards}
@keyframes drop{from{transform:translateY(-120%) scale(.6);opacity:0}to{transform:none;opacity:1}}@keyframes gr{to{width:min(60vw,420px)}}@keyframes fi{to{opacity:.85}}@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}@keyframes splo{to{opacity:0;visibility:hidden}}

.gi{position:relative}

function newPC(peer){const pc=new RTCPeerConnection(ICE);PCS[peer]=pc;pc.onicecandidate=e=>{if(e.candidate)LC.send({type:'broadcast',event:'ice',payload:isHost?{from:'host',to:peer,c:e.candidate}:{from:me.id,to:'host',c:e.candidate}})};return pc}
const flush=pc=>{(pc._q||[]).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));pc._q=[]};
function chan(){LC=sb.channel('live-'+liveId,{config:{presence:{key:me.id}}});
 LC.on('presence',{event:'sync'},()=>{const e=$('lvn');if(e)e.textContent='👁 '+Math.max(Object.keys(LC.presenceState()).length-(isHost?1:0),0)})
 .on('broadcast',{event:'chat'},({payload})=>addMsg(payload))
 .on('broadcast',{event:'like'},()=>{lkN++;lkUp()})
 .on('broadcast',{event:'end'},()=>{if(!isHost){endUI();alert('Ефір завершено')}})
 .on('broadcast',{event:'full'},({payload})=>{if(payload.to==me.id){endUI();alert('Ефір заповнений, спробуйте пізніше')}})
 .on('broadcast',{event:'join'},async({payload})=>{if(!isHost)return;if(Object.keys(PCS).length>=8)return LC.send({type:'broadcast',event:'full',payload:{to:payload.v}});
  const pc=newPC(payload.v);LS.getTracks().forEach(x=>pc.addTrack(x,LS));await pc.setLocalDescription(await pc.createOffer());LC.send({type:'broadcast',event:'offer',payload:{to:payload.v,sdp:pc.localDescription}})})
 .on('broadcast',{event:'offer'},async({payload})=>{if(isHost||payload.to!=me.id)return;const pc=newPC('host');pc.ontrack=e=>{$('lv').srcObject=e.streams[0]};
  await pc.setRemoteDescription(payload.sdp);flush(pc);await pc.setLocalDescription(await pc.createAnswer());LC.send({type:'broadcast',event:'answer',payload:{v:me.id,sdp:pc.localDescription}})})
 .on('broadcast',{event:'answer'},async({payload})=>{const pc=PCS[payload.v];if(isHost&&pc){await pc.setRemoteDescription(payload.sdp);flush(pc)}})
 .on('broadcast',{event:'ice'},({payload})=>{if(!(isHost?payload.to=='host':payload.to==me.id))return;const pc=PCS[payload.from];if(!pc||!payload.c)return;if(!pc.remoteDescription)(pc._q=pc._q||[]).push(payload.c);else pc.addIceCandidate(payload.c).catch(()=>{})})
 .subscribe(async s=>{if(s=='SUBSCRIBED'){await LC.track({u:me.id});if(!isHost)LC.send({type:'broadcast',event:'join',payload:{v:me.id}})}})}

function repI(kind,id,uid){ov(`<div class="ovl"><div class="card" style="width:min(380px,100%)"><b>🚩 ${t('report')}: ${kind}</b><p></p>${REASONS.map((r,k)=>`<button class="sec rb" onclick="sendRepI('${kind}','${id}','${uid}',${k})">${r}</button>`).join('')}<button class="sec" onclick="ov('')">✕</button></div></div>`)}
async function sendRepI(kind,id,uid,k){const{error}=await sb.from('reports').insert({reporter_id:me.id,target_id:uid,reason:`${kind} #${id}: ${REASONS[k]}`});ov('');alert(error?error.message:'✅ OK')}
const logA=(a,tg)=>{if(isAdm())sb.from('admin_log').insert({admin_id:me.id,action:a,target:String(tg||'')}).then(()=>{})};
const RX=['❤️','👍','😂','😮','😢'];
const rxs=d=>{const g={};DL.filter(x=>x.dm_id==d.id).forEach(x=>{const e=x.emoji||'❤️';g[e]=(g[e]||0)+1});return Object.entries(g).map(([e,n])=>`<span class="tag">${e} ${n}</span>`).join(' ')+` <button class="lk" onclick="rxP('${d.id}')">😊</button>`+(d.from_id!=me.id?` <button class="lk" onclick="repI('повідомлення','${d.id}','${d.from_id}')">🚩</button>`:'')};
function rxP(id){ov(`<div class="ovl"><div class="card row" style="width:auto">${RX.map(e=>`<button class="sec" style="font-size:24px" onclick="setRx('${id}','${e}')">${e}</button>`).join('')}</div></div>`)}
async function setRx(id,e){ov('');const m=DL.find(x=>String(x.dm_id)==id&&x.user_id==me.id);if(m&&(m.emoji||'❤️')==e)await sb.from('dm_likes').delete().eq('user_id',me.id).eq('dm_id',id);else await sb.from('dm_likes').upsert({user_id:me.id,dm_id:id,emoji:e},{onConflict:'user_id,dm_id'});await loadAll();draw()}
const NS=()=>{try{return +localStorage.nseen||0}catch(e){return 0}};
function notifs(){const l=[];posts.filter(p=>p.author_id==me.id).forEach(p=>p.comments.filter(c=>c.author_id!=me.id).forEach(c=>l.push({at:c.created_at,tx:`💬 #${tagN(nm(c.profiles))}: ${c.body.slice(0,40)}`})));
 fol.filter(f=>f.followed_id==me.id).forEach(f=>l.push({at:f.created_at,tx:`➕ #${tagN(nm(U(f.follower_id)))} — ${t('follow')}`}));
 dms.filter(d=>d.from_id!=me.id).forEach(d=>l.push({at:d.created_at,tx:`✉️ #${tagN(nm(U(d.from_id)))}`}));
 return l.sort((a,b)=>b.at.localeCompare(a.at)).slice(0,40)}
const bn=()=>notifs().filter(x=>new Date(x.at)>NS()).length;
function bell(){const l=notifs();try{localStorage.nseen=Date.now()}catch(e){}ov(`<div class="ovl"><div class="card" style="width:min(420px,100%);max-height:85vh;overflow:auto"><div class="row"><b>🔔 ${t('notif')}</b><button class="sec" style="margin-left:auto" onclick="ov('');draw()">✕</button></div>${l.map(n=>`<div class="card"><div>${esc(n.tx)}</div><div class="mut" style="font-size:12px">${new Date(n.at).toLocaleString()}</div></div>`).join('')||'<p class="mut">—</p>'}</div></div>`)}
const annSeen=id=>{try{return localStorage['ann'+id]}catch(e){}};
const annBar=()=>{const a=ANN[0];return !a||annSeen(a.id)?'':`<div class="card row">📢 <span style="flex:1">${esc(a.text)}</span><button class="sec" onclick="try{localStorage['ann${a.id}']=1}catch(e){}draw()">✕</button></div>`};
const annForm=()=>`<div class="card"><b>📢 ${t('ann')}</b><textarea id="annt" rows="2" maxlength="300" style="margin-top:8px"></textarea><button onclick="postAnn()">📢</button></div>`;
async function postAnn(){const x=$('annt').value.trim();if(!x)return;await sb.from('announcements').insert({text:x,author_id:me.id});logA('announcement',me.id);refresh()}
const HT=/#([\p{L}\d_]{2,30})/gu;
const lnk=s=>esc(s).replace(HT,(m,x)=>`<a href="#" onclick="event.stopPropagation();tagP('${x}');return false">${m}</a>`);
function tagP(x){const r=new RegExp('#'+x+'(?![\\p{L}\\d_])','iu'),l=posts.filter(p=>vis(p)&&r.test(p.body||''));ov(`<div class="ovl"><div class="card" style="width:min(420px,100%);max-height:88vh;overflow:auto"><div class="row"><button class="sec" onclick="trends()">←</button><b>#${esc(x)}</b><button class="sec" style="margin-left:auto" onclick="ov('')">✕</button></div><div style="margin-top:10px">${grid(l)}</div></div></div>`)}
function trends(){const c={};posts.filter(p=>vis(p)&&Date.now()-new Date(p.created_at)<6048e5).forEach(p=>[...new Set((p.body||'').toLowerCase().match(HT)||[])].forEach(h=>c[h]=(c[h]||0)+1+p.likes.length));
 const l=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,20);
 ov(`<div class="ovl"><div class="card" style="width:min(420px,100%);max-height:88vh;overflow:auto"><div class="row"><b>🔥 ${t('trends')}</b><button class="sec" style="margin-left:auto" onclick="ov('')">✕</button></div>${l.map(([h,n],i)=>`<div class="card row it" onclick="tagP('${h.slice(1)}')"><b style="width:28px">${i+1}</b><span style="flex:1">${esc(h)}</span><span class="mut">🔥 ${n}</span></div>`).join('')||'<p class="mut">—</p>'}</div></div>`)}
async function pinP(id,on){if(!on&&posts.filter(p=>p.author_id==me.id&&p.pinned).length>=3)return alert('Max 3 📌');await sb.from('posts').update({pinned:!on}).eq('id',id);ov('');refresh()}
function setTheme(v){try{localStorage.th='dark'}catch(e){}document.documentElement.dataset.theme='dark'}
try{localStorage.th='dark';document.documentElement.dataset.theme='dark'}catch(e){document.documentElement.dataset.theme='dark'}
Object.assign(K,{trends:['Тренди','Trends','Тренды','Trends','热门','Tendances','Tendencias','Tendências','Trendy','Trendy'],notif:['Сповіщення','Notifications','Уведомления','Benachrichtigungen','通知','Notifications','Notificaciones','Notificações','Powiadomienia','Oznámení'],theme:['Темна тема','Dark theme','Тёмная тема','Dunkles Design','深色主题','Thème sombre','Tema oscuro','Tema escuro','Ciemny motyw','Tmavý motiv'],ann:['Оголошення','Announcements','Объявления','Ankündigungen','公告','Annonces','Anuncios','Avisos','Ogłoszenia','Oznámení']});
setTimeout(()=>{const s=$('spl');s&&s.remove()},4200);
/* ---------- camera effects ---------- */
const FXS=[['⚪ Без','none'],['◐ Ч/Б','grayscale(1)'],['🟤 Сепія','sepia(1)'],['🌈 Яскраво','saturate(1.9) contrast(1.1)'],['❄️ Холод','hue-rotate(180deg) saturate(1.2)'],['🔥 Тепло','sepia(.4) saturate(1.5) hue-rotate(-15deg)'],['📼 Вінтаж','sepia(.6) contrast(.9) brightness(1.1)'],['🔄 Негатив','invert(1)'],['🌫 Розмиття','blur(3px)']];
let fxI=0;
const fxRow=()=>`<div id="fxr" style="display:flex;gap:6px;overflow-x:auto;padding:0 10px 10px">${FXS.map((f,i)=>`<button class="sec ${i==fxI?'liked':''}" style="padding:6px 10px;font-size:12px;flex:none" onclick="setFx(${i})">${f[0]}</button>`).join('')}</div>`;
function setFx(i){fxI=i;$('cv').style.filter=FXS[i][1];document.querySelectorAll('#fxr button').forEach((b,k)=>b.classList.toggle('liked',k==i))}
async function beat(){if(!me)return;await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id);const d=(await sb.from('profiles').select('id,name,role,avatar_url,last_seen,is_private,verified,bg_url').eq('status','approved')).data;if(d){users=d;document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',isOn(x.dataset.u)))}}
setInterval(beat,30000);
(async()=>{
 const{data}=await sb.auth.getSession();
 if(data.session){const p=await loadMe(data.session.user.id);
  if(p&&p.status=='approved'){me=p;await loadAll();beat()}else await sb.auth.signOut()}
 draw();
})();
